<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox</title></head>
<body>
<div id="root" class="flex flex-wrap items-center gap-6 p-6"></div>
<script>
var A = window.AgentQ, I = A.Icons, h = React.createElement, F = React.Fragment, useState = React.useState;
function Preview() {
  var a = useState(false), b = useState(true);
  return h(F, null,
    h(A.Checkbox, { checked: a[0], onChange: a[1], label: 'Select task', showLabel: true }),
    h(A.Checkbox, { checked: b[0], onChange: b[1], label: 'Selected task', showLabel: true }),
    h(A.Checkbox, { checked: false, indeterminate: true, onChange: function () {}, label: 'Select all pending tasks', showLabel: true }),
    h(A.Checkbox, { checked: true, disabled: true, onChange: function () {}, label: 'Disabled', showLabel: true }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Preview));
</script>
</body>
</html>
