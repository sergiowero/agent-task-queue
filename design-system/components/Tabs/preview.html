<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs</title></head>
<body>
<div id="root" class="p-6"></div>
<script>
var A = window.AgentQ, I = A.Icons, h = React.createElement, F = React.Fragment, useState = React.useState;
function Preview() {
  var t = useState('conversation');
  return h(A.Tabs, { label: 'Task activity', value: t[0], onChange: t[1], className: 'border-b border-border',
    items: [{ value: 'conversation', label: 'Conversation', icon: I.ConversationIcon, count: 4 }, { value: 'history', label: 'History', icon: I.HistoryIcon, count: 11 }] });
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Preview));
</script>
</body>
</html>
