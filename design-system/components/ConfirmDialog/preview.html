<head><meta charset="utf-8"><title>ConfirmDialog</title></head>
<body>
<div id="root" class="min-h-[300px]"></div>
<script>
var A = window.AgentQ, I = A.Icons, h = React.createElement, F = React.Fragment, useState = React.useState;
HTMLElement.prototype.focus = function () {};
function Preview() {
  return h(A.ConfirmDialog, { title: 'Cancel this task?', icon: I.CancelTaskIcon, confirmLabel: 'Cancel task', cancelLabel: 'Keep task',
    message: h(F, null, 'Agents stop working on ', h('span', { className: 'font-medium text-text' }, 'Add SSE live updates to the board'), ' and it leaves the queue. This cannot be undone.'),
    onConfirm: function () { return new Promise(function () {}); }, onClose: function () {} });
}
