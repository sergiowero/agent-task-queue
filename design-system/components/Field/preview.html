<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Field</title></head>
<body>
<div id="root" class="grid max-w-lg gap-5 p-6"></div>
<script>
var A = window.AgentQ, I = A.Icons, h = React.createElement, F = React.Fragment, useState = React.useState;

    h('div', { className: 'grid grid-cols-2 gap-4' },

        h(A.Input, { type: 'number', placeholder: '0' })),
      h(A.Field, { label: 'Poll interval (sec)', icon: I.ClockIcon, hint: 'How often it checks the queue.' },

      h(A.SegmentedControl, { label: 'Permission mode', value: mode, onChange: setMode,
