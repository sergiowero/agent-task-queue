<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EmptyState</title></head>
<body>
<div id="root" class="grid gap-4 p-6 sm:grid-cols-2"></div>
<script>
var A = window.AgentQ, I = A.Icons, h = React.createElement, F = React.Fragment, useState = React.useState;
function Preview() {
  return h(F, null,
    h('div', { className: 'card' }, h(A.EmptyState, { icon: I.RunnersIcon, title: 'No runners yet',
      description: 'Create one and it will pick up tasks from the board within seconds.',
      action: h(A.Button, { icon: I.AddIcon }, 'New runner') })),
    h('div', { className: 'card' }, h(A.EmptyState, { compact: true, icon: I.ConversationIcon, title: 'No messages yet',
      description: 'Plans, reviews and agent notes will show up here.' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Preview));
</script>
</body>
</html>
