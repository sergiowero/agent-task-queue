<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle</title></head>
<body>
<div id="root" class="grid max-w-md gap-4 p-6"></div>
<script>
var A = window.AgentQ, I = A.Icons, h = React.createElement, F = React.Fragment, useState = React.useState;
function Preview() {
  var a = useState(true), b = useState(false);
  return h(F, null,
    h(A.Toggle, { checked: a[0], onChange: a[1], icon: I.PlanIcon, label: 'Requires planning', description: 'An agent writes a plan for your review before coding.' }),
    h(A.Toggle, { checked: b[0], onChange: b[1], label: 'Requires plan' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Preview));
</script>
</body>
</html>
